name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_version:
        description: Published version used for the differential package
        default: ''
        type: string
      publish:
        description: Publish a new release after all checks pass
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: polypdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build, test and verify all packages
        env:
          BASE_VERSION: ${{ inputs.base_version || '' }}
        run: ./tools/ci.ps1 -BaseVersion $env:BASE_VERSION -SkipOcr
      - name: Save verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-packages
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/PolyPDF-*.zip
            dist/PolyPDF-*.exe
            dist/PolyPDF-*-manifest.json
            dist/package-checks.json
            dist/build-report.json
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          if-no-files-found: warn
          retention-days: 14
          path: output/ci/*.txt

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'robertmartic/polypdf'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-packages
          path: dist
      - name: Publish the tested revision and verify public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./tools/release.ps1 -Commit $env:RELEASE_COMMIT
